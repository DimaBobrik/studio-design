<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>before-after · studio-design demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Assistant:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../core.css">
<link rel="stylesheet" href="../fx/before-after.css">
<style>
  :root {
    --c-canvas: oklch(97% 0.01 110); --c-surface: oklch(93% 0.014 110); --c-ink: oklch(22% 0.02 140); --c-ink-2: oklch(38% 0.02 140); --c-muted: oklch(52% 0.02 140); --c-rule: oklch(86% 0.015 110);
    --c-accent: oklch(55% 0.1 150); --c-accent-ink: #fff; --c-focus: oklch(50% 0.13 150);
    --f-display: "Outfit", "Assistant", system-ui, sans-serif; --f-body: "Outfit", "Assistant", system-ui, sans-serif;
  }
  .wrap { display: grid; grid-template-columns: 1.6fr 1fr; gap: var(--sp-6); align-items: end; }
  h1 { font-size: var(--fs-3xl); font-weight: 300; margin-block-end: var(--sp-6); max-inline-size: 16ch; }
  .note { color: var(--c-ink-2); }
  .note b { display: block; font-size: var(--fs-2xl); font-weight: 600; color: var(--c-ink); }
  .note p + p { margin-block-start: var(--sp-5); }
  .sd-ba--tall { --ba-ratio: 4 / 5; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="section container">
  <h1 data-he="אותו חדר. שישה שבועות אחר כך.">Same room. Six weeks later.</h1>
  <div class="wrap">
    <figure class="sd-ba" data-fx="before-after" data-start="50" data-label-before="Before" data-label-after="After" data-he-attr-data-label-before="לפני" data-he-attr-data-label-after="אחרי">
      <img src="https://picsum.photos/seed/livingroom/1400/875" alt="After: bright living room with oak floors and linen curtains" data-he-alt="אחרי: סלון מואר עם פרקט אלון ווילונות פשתן" width="1400" height="875">
      <div class="sd-ba__before"><img src="https://picsum.photos/seed/livingroom/1400/875?grayscale&amp;blur=2" alt="Before: the same room with worn tiles and dim lighting" data-he-alt="לפני: אותו חדר עם אריחים שחוקים ותאורה עמומה" width="1400" height="875"></div>
      <span class="sd-ba__label sd-ba__label--before" data-he="לפני">Before</span><span class="sd-ba__label sd-ba__label--after" data-he="אחרי">After</span>
      <input class="sd-ba__range" type="range" min="0" max="100" step="0.5" value="50" aria-label="Compare the room before and after renovation" data-he-aria="השוואת החדר לפני ואחרי השיפוץ">
      <span class="sd-ba__handle" aria-hidden="true"></span>
    </figure>
    <figure class="sd-ba sd-ba--tall" data-fx="before-after" data-orientation="vertical" data-start="45" data-intro="false" data-he-attr-data-label-before="לפני" data-he-attr-data-label-after="אחרי">
      <img src="https://picsum.photos/seed/kitchenrefit/800/1000" alt="After: kitchen with new cabinetry" data-he-alt="אחרי: מטבח עם ארונות חדשים" width="800" height="1000">
      <div class="sd-ba__before"><img src="https://picsum.photos/seed/kitchenrefit/800/1000?grayscale&amp;blur=2" alt="Before: original kitchen" data-he-alt="לפני: המטבח המקורי" width="800" height="1000"></div>
      <span class="sd-ba__label sd-ba__label--before" data-he="לפני">Before</span><span class="sd-ba__label sd-ba__label--after" data-he="אחרי">After</span>
    </figure>
  </div>
  <div class="note wrap" style="margin-block-start: var(--sp-7); align-items: start">
    <p><b>42 m²</b><span data-he="שופצו בלי להזיז קיר נושא אחד.">renovated without moving a single load-bearing wall.</span></p>
    <p><b data-he="6 שבועות">6 weeks</b><span data-he="מהריסה ועד מסירת מפתח.">from demolition to handover.</span></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="_demo.js"></script>
<script src="../core.js"></script>
<script src="../fx/before-after.js"></script>
</body>
</html>
