<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scatter · studio-design demo</title>
<meta name="he-title" content="scatter · הדגמה">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..700&family=Frank+Ruhl+Libre:wght@400;700&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../core.css">
<link rel="stylesheet" href="../fx/scatter.css">
<style>
  /* Direction: fashion/gallery editorial, bone paper, didone display, images at human scale */
  :root {
    --c-canvas: oklch(95.5% 0.008 85); --c-surface: oklch(92% 0.01 85); --c-surface-2: oklch(87% 0.012 85);
    --c-ink: oklch(18% 0.01 60); --c-ink-2: oklch(32% 0.01 60); --c-muted: oklch(46% 0.01 60); --c-rule: oklch(78% 0.01 80);
    --c-accent: oklch(18% 0.01 60); --c-accent-ink: oklch(96% 0.008 85); --c-focus: oklch(50% 0.15 30);
    --f-display: "Bodoni Moda", "Frank Ruhl Libre", serif; --f-body: "Karla", "Frank Ruhl Libre", system-ui, sans-serif;
  }
  :root:where([lang="he"]) { --f-display: "Frank Ruhl Libre", serif; }
  .intro, .outro { min-block-size: 70svh; display: grid; place-content: center; text-align: center; padding: var(--section-y) var(--gutter); }
  .intro p, .outro p { color: var(--c-ink-2); font-size: var(--fs-lg); max-inline-size: 36ch; }
  .field { padding-inline: var(--gutter); }
  .anchor h2 { font-size: clamp(3rem, 1rem + 7vw, 8.5rem); font-weight: 400; line-height: 0.92; letter-spacing: -0.02em; max-inline-size: 9ch; margin-inline: auto; }
  :lang(he) .anchor h2 { letter-spacing: 0; line-height: 1; }
  .anchor p { margin-block-start: var(--sp-5); font-size: var(--fs-sm); letter-spacing: var(--tr-label); text-transform: uppercase; color: var(--c-ink-2); }
  [data-scatter-item] figcaption { font-size: var(--fs-xs); color: var(--c-muted); margin-block-start: var(--sp-2); }
</style>
</head>
<body>
<main>
  <section class="intro"><p data-he="עונה חדשה, ארכיון פתוח. גללו פנימה.">A new season, an open archive.</p></section>
  <section class="field" data-fx="scatter" data-assemble="true" data-height="125" data-range="160" data-pointer="14" aria-labelledby="sc-h">
    <div class="anchor" data-scatter-anchor>
      <h2 id="sc-h" data-he="שנים עשר חדרים, ארכיון אחד">Twelve rooms, one archive</h2>
      <p data-he="סתיו · חורף">Autumn · Winter</p>
    </div>
    <figure data-scatter-item data-x="3" data-y="5" data-w="17" data-depth="0.9"><img src="https://picsum.photos/seed/sdcoat/600/800" alt="" width="600" height="800"><figcaption data-he="מעיל צמר">Wool coat</figcaption></figure>
    <figure data-scatter-item data-x="27" data-y="2" data-w="11" data-depth="0.2"><img src="https://picsum.photos/seed/sdstair/500/650" alt="" width="500" height="650"></figure>
    <figure data-scatter-item data-x="72" data-y="4" data-w="15" data-depth="0.7"><img src="https://picsum.photos/seed/sdwindow/600/760" alt="" width="600" height="760"><figcaption data-he="חלון, מילאנו">Window, Milan</figcaption></figure>
    <figure data-scatter-item data-x="88" data-y="38" data-w="10" data-depth="0.35"><img src="https://picsum.photos/seed/sdfabric/500/700" alt="" width="500" height="700"></figure>
    <figure data-scatter-item data-x="6" data-y="58" data-w="13" data-depth="0.45"><img src="https://picsum.photos/seed/sdboots/600/700" alt="" width="600" height="700"></figure>
    <figure data-scatter-item data-x="24" data-y="74" data-w="16" data-depth="0.85"><img src="https://picsum.photos/seed/sdportrait/700/560" alt="" width="700" height="560"><figcaption data-he="סטודיו, מאי">Studio, May</figcaption></figure>
    <figure data-scatter-item data-x="62" data-y="72" data-w="12" data-depth="0.25"><img src="https://picsum.photos/seed/sdchair/500/620" alt="" width="500" height="620"></figure>
    <figure data-scatter-item data-x="78" data-y="66" data-w="17" data-depth="0.95"><img src="https://picsum.photos/seed/sdcar/760/560" alt="" width="760" height="560"><figcaption data-he="חוף, יולי">Coast, July</figcaption></figure>
  </section>
  <section class="outro"><p data-he="הקולקציה המלאה בחנות.">The full collection is in the shop.</p></section>
</main>
<script src="_demo.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
<script src="../core.js"></script>
<script src="../fx/scatter.js"></script>
</body>
</html>
