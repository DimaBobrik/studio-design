<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor · studio-design demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=Inter+Tight:wght@300..600&family=Heebo:wght@300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../core.css">
<link rel="stylesheet" href="../fx/cursor.css">
<style>
  /* Direction: photographer portfolio, charcoal + warm white */
  :root {
    --c-canvas: oklch(18% 0.006 60); --c-surface: oklch(22% 0.008 60); --c-surface-2: oklch(30% 0.01 60);
    --c-ink: oklch(95% 0.012 80); --c-ink-2: oklch(80% 0.012 80); --c-muted: oklch(62% 0.012 80); --c-rule: oklch(32% 0.01 60);
    --c-accent: oklch(78% 0.14 70); --c-accent-ink: oklch(20% 0.02 60); --c-focus: oklch(78% 0.14 70);
    --f-display: "Syne", "Heebo", system-ui, sans-serif; --f-body: "Inter Tight", "Heebo", system-ui, sans-serif;
    color-scheme: dark;
  }
  .trail-hero { min-block-size: 100svh; display: grid; place-items: center; text-align: center; padding-block: var(--sp-8); }
  .trail-hero h1 { font-size: clamp(3.5rem, 1rem + 11vw, 12rem); font-weight: 800; line-height: 0.85; letter-spacing: -0.04em; text-transform: uppercase; position: relative; z-index: 2; mix-blend-mode: difference; }
  :lang(he) .trail-hero h1 { letter-spacing: 0; font-weight: 800; }
  .trail-hero p { color: var(--c-muted); margin-block-start: var(--sp-5); position: relative; z-index: 2; }
  .list { border-block-start: 1px solid var(--c-rule); margin-block: var(--sp-8); }
  .row { display: grid; grid-template-columns: 3rem 1fr auto; gap: var(--sp-5); align-items: baseline; padding-block: var(--sp-5); border-block-end: 1px solid var(--c-rule); text-decoration: none; color: var(--c-ink); transition: color var(--d-med) var(--ease-out), padding var(--d-med) var(--ease-out); }
  .row:hover { color: var(--c-accent); }
  .row .i { font-size: var(--fs-sm); color: var(--c-muted); }
  .row h2 { font-size: var(--fs-2xl); font-weight: 600; letter-spacing: -0.03em; }
  .row span:last-child { color: var(--c-muted); font-size: var(--fs-sm); }
  .form { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); max-inline-size: 560px; padding-block: var(--sp-6) var(--sp-9); }
  .form h3 { font-family: var(--f-display); font-size: var(--fs-xl); }
  .field { display: flex; gap: var(--sp-2); }
  .field input { flex: 1; min-inline-size: 0; background: var(--c-surface); border: 1px solid var(--c-rule); border-radius: var(--r-pill); padding: 14px 20px; color: var(--c-ink); }
  .field button { padding: 14px 22px; border-radius: var(--r-pill); background: var(--c-ink); color: var(--c-canvas); font-weight: 600; }
</style>
</head>
<body data-fx="cursor" data-hide-native="true">
<main>
  <section class="trail-hero" data-fx="cursor" data-variant="trail" data-threshold="80"
    data-images="https://picsum.photos/seed/tr1/480/600|https://picsum.photos/seed/tr2/480/600|https://picsum.photos/seed/tr3/480/600|https://picsum.photos/seed/tr4/480/600|https://picsum.photos/seed/tr5/480/600|https://picsum.photos/seed/tr6/480/600">
    <div>
      <h1 data-he="נועם בר, צילום">Noam Bar, photography</h1>
      <p data-he="הזיזו את העכבר על המסך">Move the mouse across the page</p>
    </div>
  </section>
  <div class="container">
    <nav class="list" aria-label="Selected work" data-he-aria-label="עבודות נבחרות">
      <a class="row" href="#" data-cursor="View" data-he-data-cursor="צפייה"><span class="i">01</span><h2 data-he="מלח ים, 2025">Salt &amp; Sea, 2025</h2><span data-he="מסחרי">Commercial</span></a>
      <a class="row" href="#" data-cursor="View" data-he-data-cursor="צפייה"><span class="i">02</span><h2 data-he="נגב בחורף">Negev in winter</h2><span data-he="מסע">Travel</span></a>
      <a class="row" href="#" data-cursor="View" data-he-data-cursor="צפייה"><span class="i">03</span><h2 data-he="ידיים שעובדות">Working hands</h2><span data-he="פורטרט">Portrait</span></a>
    </nav>
    <form class="form" onsubmit="return false">
      <h3 data-he="מכתב חודשי">Monthly letter</h3>
      <label class="sr-only" for="em" data-he="אימייל">Email</label>
      <div class="field"><input id="em" type="email" placeholder="name@example.com" autocomplete="email"><button type="submit" data-he="הרשמה">Subscribe</button></div>
    </form>
  </div>
</main>
<script src="_demo.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
<script src="../core.js"></script>
<script src="../fx/cursor.js"></script>
</body>
</html>
